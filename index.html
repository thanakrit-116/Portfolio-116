<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>เว็บแรกของฉัน</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 500px;
      padding: 40px;
      border-radius: 20px;
      text-align: center;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .emoji {
      font-size: 60px;
    }

    h1 {
      color: #333;
      margin-bottom: 15px;
    }

    p {
      color: #666;
      font-size: 18px;
      line-height: 1.6;
    }

    .name {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;

      background: #f0f3ff;
      color: #5967d9;

      border-radius: 10px;
      font-weight: bold;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;

      border: none;
      border-radius: 10px;

      background: #5967d9;
      color: white;

      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #414fc0;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="emoji">🎉</div>

    <h1>สวัสดีครับ/ค่ะ!</h1>

    <p>
      นี่คือเว็บไซต์แรกของฉัน<br>
      สร้างด้วย HTML และ CSS 💻
    </p>

    <p>
      ชื่อ:
      <span class="name">ใส่ชื่อของคุณที่นี่</span>
    </p>

    <button onclick="alert('ยินดีต้อนรับเข้าสู่เว็บไซต์ของฉัน! 🎉')">
      คลิกที่นี่
    </button>

  </div>

</body>
</html>
